[project]
name = "genlayer-bounty-board"
version = "0.1.0"
description = """A GenLayer Intelligent Contract that escrows a bounty against a public spec and 
pays a hunter only when validators agree the work fulfills it."""
readme = "README.md"
authors = [
    { name = "Grindpa", email = "anyanwufrancischu@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "genlayer-py>=0.18.0,<0.19.0",
]

[project.scripts]
genlayer-bounty-board = "genlayer_bounty_board:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
